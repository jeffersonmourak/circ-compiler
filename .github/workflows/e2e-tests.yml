# Runs the heavier e2e suites on demand: either manually from the Actions
# tab, or when a pull request carries the `e2e-required` label.
#
# Two parallel jobs give independent signals:
#   * wasm-e2e: full `zig build test` WITHOUT SKIP_WASM_E2E, so
#     tests/e2e/topology_protocol_test.zig runs against Node's WASM runtime.
#     That test currently fails reproducibly on Linux Node (init() never
#     flips runtime_initialized to true); the failure is surfaced here so
#     it can't hide behind pr-tests.yml's SKIP_WASM_E2E=1 gate.
#   * docker-e2e: `zig build e2e-linux-docker`, which cross-compiles
#     circ-compile to a Linux ELF and runs it inside a Zig-free container.
#     This is the canonical "did we break Linux distribution?" gate.
#
# The jobs are split rather than chained so the docker-e2e signal is still
# produced when the known-broken wasm test fails.
#
# Before the label trigger works, create the label on the repo:
#   gh label create e2e-required \
#     --description "Run full E2E suite (topology_protocol + Linux Docker)" \
#     --color "5e097a"
name: E2E tests

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]
    branches: [main]

env:
  ZIG_VERSION: "0.15.1"

permissions:
  contents: read

jobs:
  wasm-e2e:
    # Manual dispatch, OR the PR carries the `e2e-required` label. `labeled`
    # fires on any label add; the contains() check filters to e2e-required.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e-required')
    name: zig build test (WASM e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # Node 24 pinned for topology_protocol_test, which spawns Node to drive
      # the compiled WASM end-to-end. Same version as pr-tests.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Go is needed for the langlang c-archive build step in build.zig.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # No SKIP_WASM_E2E here, so topology_protocol_test runs against Node.
      # Expected to fail on Linux until the WASM init bug is investigated;
      # this gate is the forcing function.
      - name: Run all tests (including WASM e2e)
        run: zig build test --summary all

  docker-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e-required')
    name: zig build e2e-linux-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # Go is needed for the langlang c-archive build step that the Linux
      # ELF cross-compile invokes. Node is intentionally absent — the
      # container image installs its own Node for the in-container drive.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # Cross-compiles circ-compile for Linux ELF, stages it in a Docker
      # build context, then runs the compiled binary inside a Zig-free
      # container. Docker is pre-installed on ubuntu-latest runners.
      - name: Run Linux Docker E2E
        run: zig build e2e-linux-docker
