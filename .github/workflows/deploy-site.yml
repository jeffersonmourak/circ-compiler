# Deploys the site under `site/` to GitHub Pages.
#
# Manual trigger only — no push triggers, so the site never redeploys
# without explicit operator action. Run from the Actions tab.
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Opt every JS-based action in this workflow into Node.js 24. GitHub is
# deprecating Node.js 20 (actions like actions/configure-pages@v5 still
# declare Node 20 in their action.yml). The runner emits a warning per
# affected action until it runs on Node 24. Setting this env globally
# silences those warnings; it'll become the default by June 2026.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Queue overlapping runs so concurrent deploys don't clobber each other.
# `cancel-in-progress: false` mirrors GitHub's recommended Pages pattern —
# in-flight deploys finish before the next one starts.
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # configure-pages runs before build so its computed `base_path`
      # output can be threaded into the Astro build as BASE_PATH. That's
      # the same env the local astro.config.mjs reads, so the same build
      # works for a user/org root site (`/`) or a project subpath
      # (`/<repo>/`) without any local config edits.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install
        working-directory: ./site

      - name: Build site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
        run: bun run build
        working-directory: ./site

      # `.nojekyll` is also shipped via site/public/ so local builds work,
      # but we re-touch here defensively — Pages serves `_`-prefixed files
      # only when `.nojekyll` is present at the artifact root.
      - name: Ensure .nojekyll
        run: touch ./site/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
