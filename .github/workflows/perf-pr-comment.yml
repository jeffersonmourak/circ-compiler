# Posts engine-bench deltas as a PR comment when a pull request carries the
# `perf` label. The PR's working tree is replayed against the base branch's
# `engine.bench.golden`, so the existing bench mismatch diff (already a
# polished per-fixture, per-counter list with absolute and % change) becomes
# the comment body for free.
#
# The comment is tagged with a hidden marker so subsequent pushes update the
# same comment instead of stacking new ones. Wall-clock (`drv_ms`) is not
# included because it's host-dependent and not asserted in the golden (see
# DOCS/benchmark.md for the broader bench design).
name: Perf bench comment

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

env:
  ZIG_VERSION: "0.15.1"

permissions:
  contents: read
  pull-requests: write

# Cancel in-flight runs when a new push lands on the same PR. The bench takes
# a couple of minutes on CI, and rapid iteration during review would otherwise
# queue up duplicate jobs and racing comment updates.
concurrency:
  group: perf-bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bench-delta:
    # Skip cheaply when the PR isn't a perf change. Re-triggers automatically
    # the moment the label is applied (the `labeled` event above), so the
    # author doesn't have to push again to get the comment.
    if: contains(github.event.pull_request.labels.*.name, 'perf')
    name: Comment engine-bench delta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Need base-branch history available so `git show origin/<base>:...`
          # can pull its golden file without a separate fetch dance.
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Resolve base ref
        id: base
        run: |
          echo "ref=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"

      - name: Snapshot base branch's engine.bench.golden
        run: |
          # checkout@v5 with fetch-depth: 0 already includes the base ref, but
          # be defensive in case CI's defaults change.
          git fetch --no-tags origin "${{ steps.base.outputs.ref }}" || true
          git show "origin/${{ steps.base.outputs.ref }}:tests/fixtures/bench/engine.bench.golden" > /tmp/base.golden
          wc -l /tmp/base.golden

      - name: Run bench against the base golden
        id: bench
        # The bench exits non-zero on counter mismatch and prints a structured
        # per-fixture diff to stderr. We tolerate that exit and capture stderr
        # for the comment body; an exit-0 means no asserted-counter change
        # vs the base, which we surface as a "no deltas" comment.
        run: |
          set +e
          cp /tmp/base.golden tests/fixtures/bench/engine.bench.golden
          zig build bench 2> /tmp/bench-stderr.txt
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "--- captured stderr (head) ---"
          head -100 /tmp/bench-stderr.txt || true

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- perf-bench-comment -->';
            const baseRef = '${{ steps.base.outputs.ref }}';
            const status = '${{ steps.bench.outputs.status }}';
            const stderr = fs.readFileSync('/tmp/bench-stderr.txt', 'utf8');

            // Three outcomes:
            //   1. Exit 0 + "golden matches" line  → no asserted-counter delta
            //   2. "golden mismatch" block in stderr → expected case: post diff
            //   3. Anything else (compile error, OOM, missing golden)
            //      → bench failed for an unrelated reason; link to logs.
            const mismatchMatch = stderr.match(/bench: golden mismatch[\s\S]*?(?=\nerror:|$)/);
            const matchedOk = /bench: golden matches/.test(stderr);
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;

            let body;
            if (status === '0' && matchedOk) {
              body = [
                marker,
                `## Engine bench: deltas vs \`${baseRef}\``,
                '',
                'No asserted-counter changes vs the base branch\'s golden.',
                '',
                '_If you intended this PR to move bench numbers, double-check that the regenerated `engine.bench.golden` was committed._',
              ].join('\n');
            } else if (mismatchMatch) {
              const diff = mismatchMatch[0].trim();
              // GitHub comments cap at 65,536 characters; the bench diff is
              // a few KB at most on the current corpus, but truncate
              // defensively so a future regression that explodes the diff
              // doesn't break the comment.
              const truncated = diff.length > 50000
                ? diff.slice(0, 50000) + '\n\n... (truncated; see the workflow logs for the full diff)'
                : diff;
              body = [
                marker,
                `## Engine bench: deltas vs \`${baseRef}\``,
                '',
                `This PR carries the \`perf\` label and the bench golden differs from \`${baseRef}\`. Per-fixture, per-counter changes are below.`,
                '',
                '<details><summary>Diff (click to expand)</summary>',
                '',
                '```text',
                truncated,
                '```',
                '',
                '</details>',
                '',
                `_Produced by running \`zig build bench\` against \`${baseRef}\`'s \`engine.bench.golden\`. Wall-clock (\`drv_ms\`) is host-dependent and not asserted, so it isn't shown; see [\`DOCS/benchmark.md\`](DOCS/benchmark.md) for the bench's measurement model._`,
              ].join('\n');
            } else {
              body = [
                marker,
                `## Engine bench: deltas vs \`${baseRef}\``,
                '',
                `Bench didn't produce a counter diff (exit \`${status}\`). This usually means a compile error, a missing golden, or an unrelated bench-runner failure; none of which the comment can summarise usefully.`,
                '',
                `See the [workflow run logs](${runUrl}) for the actual error.`,
              ].join('\n');
            }

            // Look for a prior comment from this workflow and update in place
            // so the PR conversation doesn't accumulate one comment per push.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated comment #${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info(`Created comment #${created.id}`);
            }
